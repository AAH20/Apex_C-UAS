[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "c-uas-platform"
version = "0.1.0"
description = "C-UAS Platform: Autonomous Counter-UAS Detection, Tracking, Engagement Scheduling & Airspace Forensics."
readme = "README.md"
authors = [
  { name = "Ahmed Hassan", email = "ahmed@a2zsoc.com" },
]
license = { text = "AGPL-3.0" }
keywords = [
  "counter-uas",
  "drone-detection",
  "electronic-warfare",
  "rf-fingerprinting",
  "gnss-spoofing",
  "kalman-filter",
  "mavlink",
  "dji-ocusync",
  "optical-flow-defense",
  "airspace-security",
  "c-uas",
  "anti-drone-system",
  "defense-tech",
  "directed-energy",
  "np-hard-solver",
  "engagement-scheduler",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Hardware",
  "Topic :: Security",
]
requires-python = ">=3.9"
dependencies = [
  "cryptography>=41.0.0",
]

[project.scripts]
c-uas = "c_uas.cli:main"

[tool.pytest.options]
testpaths = ["tests"]